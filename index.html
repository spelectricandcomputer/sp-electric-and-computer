<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description"
content="SP Electric & Computer - Electric, Computer, Laptop and CCTV services in Canning, West Bengal.">

<title>SP Electric & Computer | Canning</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:fast;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#061225;
  color:#fff;
  line-height:1.55;
}

a{
  text-decoration:none;
  color:inherit;
}

.container{
  width:min(1180px,94%);
  margin:auto;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(3,12,28,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid #203453;
}

.nav{
  min-height:75px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

/* GRAPHICAL LOGO */
.logo{
  display:flex;
  align-items:center;
  gap:9px;
  font-weight:900;
  font-size:1.2rem;
  letter-spacing:.5px;
}

.logo-sp{
  font-size:1.55rem;
  font-weight:1000;
  color:#ffe000;
  text-shadow:
    0 0 5px #ffe000,
    0 0 12px #ff9d00;
}

.logo-text{
  color:#fff;
}

.logo-text span{
  color:#00d9ff;
}

/* NAV */
.navlinks{
  display:flex;
  gap:22px;
}

.navlinks a{
  transition:.2s;
}

.navlinks a:hover{
  color:#ffe000;
}

/* BUTTON */
.btn{
  display:inline-block;
  padding:12px 18px;
  border-radius:9px;
  background:linear-gradient(135deg,#ffd800,#ff9d00);
  color:#081225;
  font-weight:800;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 7px 20px rgba(255,200,0,.25);
}

.btn.alt{
  background:transparent;
  color:#fff;
  border:1px solid #385274;
}

/* HERO */
.hero{
  padding:24px 0 45px;
  background:
    radial-gradient(circle at 50% 10%,#123d79 0,#061225 55%);
}

/* GRAPHICAL BRAND TITLE */
.brand-title{
  text-align:center;
  padding:22px 10px 25px;
}

.brand-title .sp{
  display:block;
  font-size:48px;
  font-weight:1000;
  color:#ffe000;
  letter-spacing:5px;
  text-shadow:
    0 0 5px #ffe000,
    0 0 12px #ffb300,
    0 0 25px rgba(255,174,0,.7);
}

.brand-title .name{
  display:block;
  font-size:28px;
  font-weight:900;
  letter-spacing:2px;
  color:#fff;
  text-shadow:
    0 0 5px #fff,
    0 0 12px #00d9ff,
    0 0 22px rgba(0,217,255,.65);
}

.brand-title .tagline{
  margin-top:7px;
  color:#9edfff;
  font-size:14px;
  letter-spacing:1px;
}

.banner{
  width:100%;
  display:block;
  border-radius:18px;
  border:2px solid #1e7cff;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
}

.hero-actions{
  text-align:center;
  padding-top:25px;
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}

/* SECTIONS */
section{
  padding:80px 0;
}

.head{
  text-align:center;
  margin-bottom:40px;
}

.head h2{
  font-size:2.3rem;
}

.head p{
  color:#aebdd1;
  margin-top:7px;
}

/* SERVICES */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.card{
  display:block;
  background:linear-gradient(180deg,#10233d,#0b172a);
  border:1px solid #263b5b;
  border-radius:16px;
  padding:25px;
  text-align:center;
  transition:.25s;
}

.card:hover{
  transform:translateY(-6px);
  border-color:#2da7ff;
  box-shadow:0 10px 30px rgba(45,167,255,.15);
}

.icon{
  font-size:2.4rem;
  margin-bottom:12px;
}

.card h3{
  margin-bottom:7px;
}

.card p{
  color:#aebdd1;
  font-size:.94rem;
}

/* ABOUT */
.about{
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:28px;
  align-items:stretch;
}

.box{
  background:#0d1d33;
  border:1px solid #263b5b;
  border-radius:18px;
  padding:30px;
}

.box p{
  color:#b5c2d3;
  margin:12px 0;
}

.list{
  display:grid;
  gap:10px;
  margin-top:18px;
}

.list div{
  padding:10px 12px;
  background:#09162a;
  border-radius:8px;
}

/* CONTACT */
.contact{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px;
}

.contact-item{
  padding:17px 0;
  border-bottom:1px solid #263b5b;
}

.contact-item:last-child{
  border:0;
}

.label{
  display:block;
  color:#7fd3ff;
  font-size:.85rem;
  font-weight:700;
  margin-bottom:4px;
}

form{
  display:grid;
  gap:12px;
}

input,
textarea{
  width:100%;
  padding:14px;
  border-radius:9px;
  border:1px solid #314764;
  background:#071327;
  color:white;
  font:inherit;
}

textarea{
  min-height:130px;
  resize:vertical;
}

/* FLOATING BUTTON */
.float{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:30;
}

/* FOOTER */
footer{
  padding:28px 0;
  border-top:1px solid #263b5b;
  text-align:center;
  color:#9eafc4;
}

/* MOBILE */
@media(max-width:850px){

  .navlinks{
    display:none;
  }

  .grid{
    grid-template-columns:1fr 1fr;
  }

  .about,
  .contact{
    grid-template-columns:1fr;
  }

}

@media(max-width:520px){

  .nav{
    min-height:65px;
  }

  .logo{
    font-size:1rem;
  }

  .logo-sp{
    font-size:1.3rem;
  }

  .brand-title .sp{
    font-size:40px;
  }

  .brand-title .name{
    font-size:21px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .hero{
    padding-top:10px;
  }

  .banner{
    border-radius:10px;
  }

  section{
    padding:60px 0;
  }

  .head h2{
    font-size:1.9rem;
  }

}
</style>
</head>

<body>

      <span class="logo-sp">SP</span>
      <span class="logo-text">Electric <span>&amp;</span> Computer</span>
    </a>

    <div class="navlinks">
      <a href="#home">Home</a>
      <
